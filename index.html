<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Carrefour FINAL EJE CENTRAL</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <style>
        /* --- ESTILOS VISUALES --- */
        :root { --azul-carrefour: #0B3A8F; }
        body { font-family: 'Ubuntu', sans-serif; background: #222; margin: 0; padding: 20px; color: white; display: flex; flex-direction: column; align-items: center; }
        
        .panel { background: #333; padding: 30px; border-radius: 12px; width: 100%; max-width: 800px; border: 1px solid #444; margin-bottom: 20px;}
        h1 { margin-top: 0; border-bottom: 2px solid var(--azul-carrefour); padding-bottom: 10px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #ccc; }
        select, input { width: 100%; padding: 10px; background: #111; border: 1px solid #555; color: white; border-radius: 5px; }
        
        .console { background: #000; color: #0f0; font-family: monospace; padding: 15px; height: 200px; overflow-y: auto; border-radius: 5px; font-size: 12px; border: 1px solid #555; }
        
        .btn-main { background: var(--azul-carrefour); color: white; width: 100%; padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; margin-top: 10px;}
        .btn-main:hover { background: #154bb5; }
        .btn-main:disabled { background: #555; cursor: not-allowed; }

        /* --- FÁBRICA FANTASMA (1000x1000) --- */
        #shadow-factory { position: fixed; top: 0; left: -10000px; width: 1000px; height: 1000px; background: #fff; z-index: -9999; }
        .canvas-container { position: relative; width: 1000px; height: 1000px; overflow: hidden; image-rendering: high-quality; }
        
        /* CAPAS DE FONDO Y FOOTER */
        .bg-layer { position: absolute; top: 0; left: 0; width: 1000px; height: 1000px; background-size: cover; background-position: center; z-index: 1; }
        .layer-png-abs { position: absolute; pointer-events: none; }
        #layer-footer { width: 1000px; height: 167px; bottom: 0; left: 0; z-index: 10; }

        /* --- SISTEMA DE ALINEACIÓN EJE CENTRAL --- */
        
        /* Contenedor de Referencia: Mide y se ubica igual que el ícono */
        .header-wrapper {
            position: absolute;
            top: 30px; 
            left: 30px;
            width: 900px; /* Ancho disponible */
            height: 155px; /* ALTURA EXACTA DEL BADGE */
            z-index: 30;
            /* border: 1px solid red; /* Descomentar para ver la caja de alineación */
        }

        /* 1. Ícono (Pegado a la izquierda) */
        #layer-badge-flex {
            position: absolute;
            left: 0;
            top: 0;
            width: 187px;
            height: 155px;
            z-index: 20; /* Encima del texto */
        }

        /* 2. Pastilla de Texto (Centrada Matemáticamente) */
        .title-pill-centered {
            position: absolute;
            left: 140px; /* Se mete debajo del ícono (187 - overlap) */
            
            /* LA MAGIA DEL CENTRADO: */
            top: 50%; 
            transform: translateY(-50%);
            
            z-index: 10; /* Debajo del ícono */
            
            background: #fff;
            border-radius: 0 50px 50px 0;
            
            /* Relleno interno */
            padding-left: 60px; 
            padding-right: 50px;
            padding-top: 10px;
            padding-bottom: 10px;
            
            /* Comportamiento visual */
            min-height: 80px;
            display: flex;
            align-items: center; /* Centra el texto dentro de la pastilla */
            box-sizing: border-box;
            max-width: 750px;
        }

        #txt-title {
            color: var(--azul-carrefour);
            font-weight: 700;
            font-size: 60px;
            line-height: 1.1; 
            margin: 0;
            
            /* Configuración Multilínea */
            white-space: normal;
            word-wrap: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* PESO */
        #txt-weight {
            position: absolute; bottom: 50px; right: 0; width: 215px; text-align: center;
            color: #fff; font-weight: 700; font-size: 55px; line-height: 1; z-index: 40; white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="panel">
        <h1>🛠️ Generador Carrefour: EJE CENTRAL</h1>
        
        <div class="grid-2">
            <div>
                <label>1. Archivo CSV</label>
                <input type="file" id="csv-file" accept=".csv">
            </div>
            <div>
                <label>2. Codificación</label>
                <select id="encoding-select">
                    <option value="ISO-8859-1" selected>Excel Español (Windows-1252)</option>
                    <option value="UTF-8">UTF-8 (Moderno)</option>
                </select>
            </div>
        </div>

        <button id="btn-process" class="btn-main" onclick="startBatch()">🚀 PROCESAR IMÁGENES</button>
        
        <div style="margin-top: 10px; font-size: 0.9em; color: #aaa;">LOG DEL SISTEMA:</div>
        <div class="console" id="console-log">Esperando archivo...</div>
    </div>

    <div id="shadow-factory">
        <div class="canvas-container" id="capture-area">
            <div id="bg-layer" class="bg-layer"></div>
            <img id="layer-footer" class="layer-png-abs" src="footer_full.png">
            
            <div class="header-wrapper">
                <img id="layer-badge-flex" src="badge_vaca.png">
                <div class="title-pill-centered">
                    <span id="txt-title">TITULO DEL PRODUCTO</span>
                </div>
            </div>
            
            <div id="txt-weight">1 KG</div>
        </div>
    </div>

    <script>
        const logArea = document.getElementById('console-log');
        function log(msg) {
            logArea.innerHTML += `> ${msg}<br>`;
            logArea.scrollTop = logArea.scrollHeight;
        }

        // --- 1. DETECCIÓN DE ÍCONOS ---
        function getBadgeFile(row) {
            const fullText = JSON.stringify(row).toLowerCase();

            if (fullText.includes('cerdo') || fullText.includes('puerco') || fullText.includes('jamon') || fullText.includes('jamón') || fullText.includes('fiambre') || fullText.includes('bondiola') || fullText.includes('panceta') || fullText.includes('pechito')) return 'badge_cerdo.png';
            if (fullText.includes('pollo') || fullText.includes('ave') || fullText.includes('patitas') || fullText.includes('suprema') || fullText.includes('granja')) return 'badge_pollo.png';
            if (fullText.includes('pescado') || fullText.includes('mar') || fullText.includes('filet') || fullText.includes('merluza') || fullText.includes('calamar')) return 'badge_pescado.png';
            return 'badge_vaca.png';
        }

        // --- 2. DETECCIÓN DE FOOTER ---
        function getFooterFile(cooking) {
            const c = (cooking || '').toLowerCase();
            const hasParrilla = c.includes('parrilla');
            const hasHorno = c.includes('horno');
            const hasOlla = c.includes('olla');

            if (hasParrilla && hasHorno && hasOlla) return 'footer_full.png';
            if (hasParrilla && hasHorno) return 'footer_parrilla_horno.png';
            if (hasParrilla && hasOlla) return 'footer_parrilla_olla.png';
            if (hasHorno && hasOlla) return 'footer_horno_olla.png';
            if (hasParrilla) return 'footer_parrilla.png';
            if (hasHorno) return 'footer_horno.png';
            if (hasOlla) return 'footer_olla.png';
            return 'footer_full.png';
        }

        // --- 3. AUTO-AJUSTE PARA QUE ENTRE ---
        function fitText() {
            const titleEl = document.getElementById('txt-title');
            let fontSize = 60; 
            titleEl.style.fontSize = fontSize + 'px';
            
            // Si el texto tiene 2 líneas muy largas (altura > 135), achicar
            while (titleEl.scrollHeight > 140 && fontSize > 25) {
                fontSize -= 2;
                titleEl.style.fontSize = fontSize + 'px';
            }
        }

        // --- 4. BUSCADOR DE UNIDAD ---
        function findUnitValue(row) {
            if (row.unidad) return row.unidad;
            if (row.peso) return row.peso;
            if (row.contenido) return row.contenido;
            const keys = Object.keys(row);
            for (let k of keys) {
                const val = (row[k] || '').toString().trim();
                if (/^\d+(\.|,)?\d*\s*(kg|g|gr|un|ml|cc|lts|l)$/i.test(val)) return val;
            }
            return ''; 
        }

        // --- 5. NORMALIZADOR ---
        function normalizeRowKeys(row) {
            const newRow = {};
            Object.keys(row).forEach(key => {
                const cleanKey = key.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); 
                newRow[cleanKey] = row[key];
            });
            return newRow;
        }

        // --- 6. SETUP ---
        function setupCanvas(rawRow) {
            return new Promise((resolve, reject) => {
                const row = normalizeRowKeys(rawRow);
                
                // Texto
                const titleText = (row.nombre_producto || row.producto || row.titulo || 'SIN NOMBRE').trim();
                document.getElementById('txt-title').innerText = titleText;
                
                // Unidad
                const unitValue = findUnitValue(row);
                document.getElementById('txt-weight').innerText = unitValue;

                // Ajustar
                fitText();

                // Imágenes
                document.getElementById('layer-badge-flex').src = getBadgeFile(row); 
                document.getElementById('layer-footer').src = getFooterFile(row.coccion);

                // Fondo
                const imgUrl = row.imagen_url || row.imagen || row.foto || '';
                const bgLayer = document.getElementById('bg-layer');
                bgLayer.style.backgroundImage = 'none';
                
                if (!imgUrl) { resolve(); return; }

                const tempImg = new Image();
                tempImg.crossOrigin = "Anonymous"; 
                tempImg.onload = () => {
                    bgLayer.style.backgroundImage = `url('${imgUrl}')`;
                    resolve();
                };
                tempImg.onerror = () => {
                    bgLayer.style.backgroundColor = '#444';
                    resolve();
                };
                tempImg.src = imgUrl + (imgUrl.includes('?') ? '&' : '?') + 'cb=' + new Date().getTime();
            });
        }

        // --- 7. CAPTURA ---
        function generateImage() {
            const area = document.getElementById('capture-area');
            return new Promise((resolve, reject) => {
                html2canvas(area, {
                    scale: 2, 
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: null,
                    logging: false,
                    onclone: (doc) => {
                        const el = doc.getElementById('capture-area');
                        el.style.fontFeatureSettings = '"liga" 0';
                        el.style.imageRendering = 'high-quality';
                    }
                }).then(canvas => {
                    canvas.toBlob(blob => resolve(blob), 'image/webp', 0.95);
                }).catch(reject);
            });
        }

        // --- MOTOR ---
        async function startBatch() {
            const fileInput = document.getElementById('csv-file');
            const encoding = document.getElementById('encoding-select').value;
            
            if (!fileInput.files.length) { alert('Falta el CSV'); return; }

            const btn = document.getElementById('btn-process');
            btn.disabled = true; btn.innerText = '⏳ PROCESANDO...';
            logArea.innerHTML = '';

            Papa.parse(fileInput.files[0], {
                header: true,
                skipEmptyLines: true,
                encoding: encoding,
                complete: async function(results) {
                    const rows = results.data;
                    const zip = new JSZip();
                    const folder = zip.folder("Carrefour_Eje_Central");

                    await document.fonts.ready;
                    
                    for (let i = 0; i < rows.length; i++) {
                        const row = rows[i];
                        if (!Object.values(row).some(x => x)) continue;

                        try {
                            const nRow = normalizeRowKeys(row);
                            const pName = nRow.nombre_producto || 'Producto_' + i;
                            log(`📸 Generando: ${pName}`);
                            await setupCanvas(row);
                            await new Promise(r => setTimeout(r, 50)); 
                            const blob = await generateImage();
                            const cleanName = pName.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                            folder.file(`${cleanName}.webp`, blob); 
                        } catch (error) { log(`❌ Error: ${error.message}`); }
                    }

                    const content = await zip.generateAsync({type:"blob"});
                    saveAs(content, "Ofertas_Carrefour_Centrado.zip");
                    btn.disabled = false; btn.innerText = '🚀 PROCESAR IMÁGENES';
                    log('✅ ¡TERMINADO!');
                }
            });
        }
    </script>
</body>
</html>
