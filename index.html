<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generador Carrefour FINAL EJE CENTRAL</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Ubuntu (tuya) + Inter (UI pro) -->
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <style>
    /* =========================================================
       UI "VERCEL-ISH" + FILE PICKER PRO
       (NO cambia funcionalidad, sólo estética)
       ========================================================= */
    :root{
      --azul-carrefour:#0B3A8F;

      --bg:#05070D;
      --panel: rgba(255,255,255,.06);
      --panel2: rgba(255,255,255,.04);
      --border: rgba(255,255,255,.10);
      --border2: rgba(255,255,255,.16);

      --text:#F5F7FF;
      --muted: rgba(245,247,255,.70);
      --muted2: rgba(245,247,255,.55);

      --shadow: 0 20px 60px rgba(0,0,0,.55);
      --shadow2: 0 12px 35px rgba(0,0,0,.35);

      --radius: 18px;
      --radius2: 14px;

      --focus: 0 0 0 4px rgba(255,255,255,.10), 0 0 0 6px rgba(11,58,143,.22);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      padding: 28px 18px 38px;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);

      /* Fondo tipo Vercel */
      background:
        radial-gradient(900px 520px at 18% -5%, rgba(0,255,200,.18), transparent 60%),
        radial-gradient(820px 520px at 85% 5%, rgba(255,0,180,.14), transparent 60%),
        radial-gradient(900px 560px at 50% 120%, rgba(120,90,255,.12), transparent 60%),
        linear-gradient(180deg, #000, var(--bg));

      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 18px;
    }

    /* Grid blueprint sutil */
    body::before{
      content:"";
      position: fixed;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px) 0 0/ 48px 48px,
        linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px) 0 0/ 48px 48px;
      opacity:.22;
      mask: radial-gradient(900px 650px at 25% 0%, #000 10%, transparent 65%);
    }

    .panel{
      width:100%;
      max-width: 940px;
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position:relative;
      isolation:isolate;
    }

    /* brillo sutil arriba */
    .panel::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      border-radius: var(--radius);
      background: radial-gradient(700px 220px at 20% 0%, rgba(255,255,255,.10), transparent 60%);
      opacity:.65;
      z-index:-1;
    }

    h1{
      margin:0 0 18px 0;
      padding-bottom: 14px;
      font-family: 'Ubuntu', Inter, system-ui, sans-serif;
      font-size: 28px;
      letter-spacing:.2px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      display:flex;
      align-items:center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1::after{
      content:"";
      display:block;
      height:2px;
      flex:1 1 240px;
      margin-left: 14px;
      background: linear-gradient(90deg, rgba(11,58,143,1), rgba(11,58,143,0));
      border-radius: 999px;
      opacity:.8;
    }

    .grid-2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }
    @media (max-width: 760px){
      .grid-2{ grid-template-columns: 1fr; }
      h1::after{ flex-basis: 100%; margin-left: 0; }
    }

    label{
      display:block;
      margin-bottom: 8px;
      font-weight: 800;
      font-size: 12px;
      letter-spacing:.22px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .helper{
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted2);
    }

    /* Inputs */
    select, input{
      width:100%;
      padding: 12px 12px;
      border-radius: var(--radius2);
      background: rgba(0,0,0,.38);
      color: var(--text);
      border: 1px solid rgba(255,255,255,.12);
      outline:none;
      transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
      box-shadow: var(--shadow2);
    }
    select:focus, input:focus{
      border-color: rgba(11,58,143,.55);
      box-shadow: var(--focus);
    }

    /* =========================================================
       FILE PICKER PRO (100% custom, mantiene id="csv-file")
       ========================================================= */
    .file-pro{
      position: relative;
      width: 100%;
    }

    /* input real invisible (pero funcional) */
    .file-pro input[type="file"]{
      position:absolute;
      inset:0;
      opacity:0;
      cursor:pointer;
      z-index: 3;
    }

    /* UI visible */
    .file-ui{
      display:flex;
      align-items:center;
      gap: 12px;
      padding: 12px;
      border-radius: 16px;
      background: rgba(0,0,0,.38);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: var(--shadow2), inset 0 1px 0 rgba(255,255,255,.06);
      user-select:none;
    }

    .file-ui:focus{
      outline:none;
      border-color: rgba(11,58,143,.55);
      box-shadow: var(--focus);
    }

    .file-btn{
      flex: 0 0 auto;
      padding: 10px 12px;
      border-radius: 14px;
      font-weight: 900;
      letter-spacing: .35px;
      color: #fff;
      background:
        radial-gradient(140px 60px at 20% 0%, rgba(255,255,255,.26), transparent 60%),
        linear-gradient(135deg, rgba(11,58,143,1), rgba(13,86,214,1));
      box-shadow: 0 18px 40px rgba(11,58,143,.35), inset 0 1px 0 rgba(255,255,255,.20);
      border: 1px solid rgba(255,255,255,.14);
      transition: transform .12s ease, filter .12s ease;
    }

    .file-name{
      color: rgba(245,247,255,.80);
      font-weight: 700;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      min-width: 0;
    }

    .file-pro:hover .file-btn{
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    /* Botón principal */
    .btn-main{
      width:100%;
      padding: 14px 16px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 16px;
      cursor:pointer;
      color:#fff;
      font-weight: 900;
      letter-spacing:.6px;
      text-transform: uppercase;
      background:
        radial-gradient(140px 60px at 20% 0%, rgba(255,255,255,.26), transparent 60%),
        linear-gradient(135deg, rgba(11,58,143,1), rgba(13,86,214,1));
      box-shadow: 0 18px 40px rgba(11,58,143,.35), inset 0 1px 0 rgba(255,255,255,.20);
      transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
      margin-top: 6px;
    }
    .btn-main:hover{
      transform: translateY(-1px);
      filter: brightness(1.05);
    }
    .btn-main:disabled{
      background: rgba(255,255,255,.10);
      border-color: rgba(255,255,255,.10);
      box-shadow:none;
      opacity:.65;
      cursor:not-allowed;
    }

    /* Título log (tu inline style se mantiene, pero lo mejoro también) */
    .log-title{
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing:.22px;
      font-weight: 900;
    }

    /* Consola */
    .console{
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      padding: 14px;
      height: 240px;
      overflow-y:auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      font-size: 12px;
      line-height: 1.55;
      color: #35D07F;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    }

    .console::-webkit-scrollbar{ width: 10px; }
    .console::-webkit-scrollbar-thumb{
      background: rgba(255,255,255,.16);
      border-radius: 999px;
      border: 2px solid rgba(0,0,0,.35);
    }

    /* =========================================================
       FÁBRICA FANTASMA (INTACTA)
       ========================================================= */
    #shadow-factory { position: fixed; top: 0; left: -10000px; width: 1000px; height: 1000px; background: #fff; z-index: -9999; }
    .canvas-container { position: relative; width: 1000px; height: 1000px; overflow: hidden; image-rendering: high-quality; }

    .bg-layer { position: absolute; top: 0; left: 0; width: 1000px; height: 1000px; background-size: cover; background-position: center; z-index: 1; }
    .layer-png-abs { position: absolute; pointer-events: none; }
    #layer-footer { width: 1000px; height: 167px; bottom: 0; left: 0; z-index: 10; }

    .header-wrapper {
      position: absolute;
      top: 30px;
      left: 30px;
      width: 900px;
      height: 155px;
      z-index: 30;
    }

    #layer-badge-flex {
      position: absolute;
      left: 0;
      top: 0;
      width: 187px;
      height: 155px;
      z-index: 20;
    }

    .title-pill-centered {
      position: absolute;
      left: 140px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      background: #fff;
      border-radius: 0 50px 50px 0;
      padding-left: 60px;
      padding-right: 50px;
      padding-top: 10px;
      padding-bottom: 10px;
      min-height: 80px;
      display: flex;
      align-items: center;
      box-sizing: border-box;
      max-width: 750px;
    }

    #txt-title {
      color: var(--azul-carrefour);
      font-weight: 700;
      font-size: 60px;
      line-height: 1.1;
      margin: 0;
      white-space: normal;
      word-wrap: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-family: 'Ubuntu', Inter, system-ui, sans-serif;
    }

    #txt-weight {
      position: absolute;
      bottom: 50px;
      right: 0;
      width: 215px;
      text-align: center;
      color: #fff;
      font-weight: 700;
      font-size: 55px;
      line-height: 1;
      z-index: 40;
      white-space: nowrap;
      font-family: 'Ubuntu', Inter, system-ui, sans-serif;
    }

    @media (prefers-reduced-motion: reduce){
      *{ transition:none !important; scroll-behavior:auto !important; }
    }
  </style>
</head>

<body>

  <div class="panel">
    <h1>🛠️ Generador Carrefour: EJE CENTRAL</h1>

    <div class="grid-2">
      <div>
        <label>1. Archivo CSV</label>

        <!-- FILE PICKER PRO -->
        <div class="file-pro">
          <input type="file" id="csv-file" accept=".csv">
          <div class="file-ui" role="button" tabindex="0" aria-label="Seleccionar archivo CSV">
            <span class="file-btn">Seleccionar CSV</span>
            <span class="file-name" id="csv-file-name">Ningún archivo seleccionado</span>
          </div>
        </div>

        <div class="helper">Tip: exportalo como CSV con encabezados (header) y sin filas vacías.</div>
      </div>

      <div>
        <label>2. Codificación</label>
        <select id="encoding-select">
          <option value="ISO-8859-1" selected>Excel Español (Windows-1252)</option>
          <option value="UTF-8">UTF-8 (Moderno)</option>
        </select>
        <div class="helper">Si ves caracteres raros (acentos), probá alternar esta opción.</div>
      </div>
    </div>

    <button id="btn-process" class="btn-main" onclick="startBatch()">🚀 PROCESAR IMÁGENES</button>

    <div class="log-title">LOG DEL SISTEMA:</div>
    <div class="console" id="console-log">Esperando archivo...</div>
  </div>

  <!-- FÁBRICA FANTASMA -->
  <div id="shadow-factory">
    <div class="canvas-container" id="capture-area">
      <div id="bg-layer" class="bg-layer"></div>
      <img id="layer-footer" class="layer-png-abs" src="footer_full.png">

      <div class="header-wrapper">
        <img id="layer-badge-flex" src="badge_vaca.png">
        <div class="title-pill-centered">
          <span id="txt-title">TITULO DEL PRODUCTO</span>
        </div>
      </div>

      <div id="txt-weight">1 KG</div>
    </div>
  </div>

  <script>
    const logArea = document.getElementById('console-log');

    function log(msg) {
      logArea.innerHTML += `> ${msg}<br>`;
      logArea.scrollTop = logArea.scrollHeight;
    }

    // File picker PRO: muestra nombre (sin afectar funcionalidad)
    const fileInput = document.getElementById('csv-file');
    const fileNameEl = document.getElementById('csv-file-name');
    const fileUi = document.querySelector('.file-ui');

    if (fileInput && fileNameEl) {
      fileInput.addEventListener('change', () => {
        fileNameEl.textContent = (fileInput.files && fileInput.files[0]) ? fileInput.files[0].name : 'Ningún archivo seleccionado';
      });
    }

    // Accesibilidad: permitir click con Enter/Espacio en la UI
    if (fileUi && fileInput) {
      fileUi.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          fileInput.click();
        }
      });
    }

    // --- 1. DETECCIÓN DE ÍCONOS ---
    function getBadgeFile(row) {
      const fullText = JSON.stringify(row).toLowerCase();

      if (fullText.includes('cerdo') || fullText.includes('puerco') || fullText.includes('jamon') || fullText.includes('jamón') || fullText.includes('fiambre') || fullText.includes('bondiola') || fullText.includes('panceta') || fullText.includes('pechito')) return 'badge_cerdo.png';
      if (fullText.includes('pollo') || fullText.includes('ave') || fullText.includes('patitas') || fullText.includes('suprema') || fullText.includes('granja')) return 'badge_pollo.png';
      if (fullText.includes('pescado') || fullText.includes('mar') || fullText.includes('filet') || fullText.includes('merluza') || fullText.includes('calamar')) return 'badge_pescado.png';
      return 'badge_vaca.png';
    }

    // --- 2. DETECCIÓN DE FOOTER ---
    function getFooterFile(cooking) {
      const c = (cooking || '').toLowerCase();
      const hasParrilla = c.includes('parrilla');
      const hasHorno = c.includes('horno');
      const hasOlla = c.includes('olla');

      if (hasParrilla && hasHorno && hasOlla) return 'footer_full.png';
      if (hasParrilla && hasHorno) return 'footer_parrilla_horno.png';
      if (hasParrilla && hasOlla) return 'footer_parrilla_olla.png';
      if (hasHorno && hasOlla) return 'footer_horno_olla.png';
      if (hasParrilla) return 'footer_parrilla.png';
      if (hasHorno) return 'footer_horno.png';
      if (hasOlla) return 'footer_olla.png';
      return 'footer_full.png';
    }

    // --- 3. AUTO-AJUSTE PARA QUE ENTRE ---
    function fitText() {
      const titleEl = document.getElementById('txt-title');
      let fontSize = 60;
      titleEl.style.fontSize = fontSize + 'px';

      while (titleEl.scrollHeight > 140 && fontSize > 25) {
        fontSize -= 2;
        titleEl.style.fontSize = fontSize + 'px';
      }
    }

    // --- 4. BUSCADOR DE UNIDAD ---
    function findUnitValue(row) {
      if (row.unidad) return row.unidad;
      if (row.peso) return row.peso;
      if (row.contenido) return row.contenido;
      const keys = Object.keys(row);
      for (let k of keys) {
        const val = (row[k] || '').toString().trim();
        if (/^\d+(\.|,)?\d*\s*(kg|g|gr|un|ml|cc|lts|l)$/i.test(val)) return val;
      }
      return '';
    }

    // --- 5. NORMALIZADOR ---
    function normalizeRowKeys(row) {
      const newRow = {};
      Object.keys(row).forEach(key => {
        const cleanKey = key.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        newRow[cleanKey] = row[key];
      });
      return newRow;
    }

    // --- 6. SETUP ---
    function setupCanvas(rawRow) {
      return new Promise((resolve, reject) => {
        const row = normalizeRowKeys(rawRow);

        // Texto
        const titleText = (row.nombre_producto || row.producto || row.titulo || 'SIN NOMBRE').trim();
        document.getElementById('txt-title').innerText = titleText;

        // Unidad
        const unitValue = findUnitValue(row);
        document.getElementById('txt-weight').innerText = unitValue;

        // Ajustar
        fitText();

        // Imágenes
        document.getElementById('layer-badge-flex').src = getBadgeFile(row);
        document.getElementById('layer-footer').src = getFooterFile(row.coccion);

        // Fondo
        const imgUrl = row.imagen_url || row.imagen || row.foto || '';
        const bgLayer = document.getElementById('bg-layer');
        bgLayer.style.backgroundImage = 'none';

        if (!imgUrl) { resolve(); return; }

        const tempImg = new Image();
        tempImg.crossOrigin = "Anonymous";
        tempImg.onload = () => {
          bgLayer.style.backgroundImage = `url('${imgUrl}')`;
          resolve();
        };
        tempImg.onerror = () => {
          bgLayer.style.backgroundColor = '#444';
          resolve();
        };
        tempImg.src = imgUrl + (imgUrl.includes('?') ? '&' : '?') + 'cb=' + new Date().getTime();
      });
    }

    // --- 7. CAPTURA ---
    function generateImage() {
      const area = document.getElementById('capture-area');
      return new Promise((resolve, reject) => {
        html2canvas(area, {
          scale: 2,
          useCORS: true,
          allowTaint: true,
          backgroundColor: null,
          logging: false,
          onclone: (doc) => {
            const el = doc.getElementById('capture-area');
            el.style.fontFeatureSettings = '"liga" 0';
            el.style.imageRendering = 'high-quality';
          }
        }).then(canvas => {
          canvas.toBlob(blob => resolve(blob), 'image/webp', 0.95);
        }).catch(reject);
      });
    }

    // --- MOTOR ---
    async function startBatch() {
      const fileInput = document.getElementById('csv-file');
      const encoding = document.getElementById('encoding-select').value;

      if (!fileInput.files.length) { alert('Falta el CSV'); return; }

      const btn = document.getElementById('btn-process');
      btn.disabled = true; btn.innerText = '⏳ PROCESANDO...';
      logArea.innerHTML = '';

      Papa.parse(fileInput.files[0], {
        header: true,
        skipEmptyLines: true,
        encoding: encoding,
        complete: async function(results) {
          const rows = results.data;
          const zip = new JSZip();
          const folder = zip.folder("Carrefour_Eje_Central");

          await document.fonts.ready;

          for (let i = 0; i < rows.length; i++) {
            const row = rows[i];
            if (!Object.values(row).some(x => x)) continue;

            try {
              const nRow = normalizeRowKeys(row);
              const pName = nRow.nombre_producto || 'Producto_' + i;
              log(`📸 Generando: ${pName}`);
              await setupCanvas(row);
              await new Promise(r => setTimeout(r, 50));
              const blob = await generateImage();
              const cleanName = pName.replace(/[^a-z0-9]/gi, '_').toLowerCase();
              folder.file(`${cleanName}.webp`, blob);
            } catch (error) {
              log(`❌ Error: ${error.message}`);
            }
          }

          const content = await zip.generateAsync({type:"blob"});
          saveAs(content, "Ofertas_Carrefour_Centrado.zip");
          btn.disabled = false; btn.innerText = '🚀 PROCESAR IMÁGENES';
          log('✅ ¡TERMINADO!');
        }
      });
    }
  </script>

</body>
</html>
